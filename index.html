<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Головна | Кирилюк Микола</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        /* ========================================
           LOADER — TYPEWRITER ON BLACK SCREEN
           ======================================== */
        .loader-overlay {
            position: fixed; inset: 0; z-index: 9999;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            opacity: 1;
            transition: opacity 0.9s ease, visibility 0.9s ease;
        }
        .loader-overlay.hidden {
            opacity: 0; visibility: hidden; pointer-events: none;
        }
        /* If loader should be skipped entirely */
        .loader-overlay.skip {
            display: none;
        }
        /* Typewriter */
        .typewriter-area {
            letter-spacing: 2px; text-transform: uppercase;
        }
        /* Gemini */
        .gemini-logo .label { color: #8be9fd; }
        .gemini-logo svg { width: 42px; height: 42px; }
        .gemini-draw {
            fill: none; stroke: #8be9fd; stroke-width: 1.5;
            stroke-dasharray: 250; stroke-dashoffset: 250;
            transition: stroke-dashoffset 1.2s ease;
        /*
           ЛОГО — КАРТИНКИ
           Поклади файли в ту ж папку що й index.html:
             • gemini-logo.png   — лого Google Gemini
             • antigravity-logo.png — лого Antigravity
        */
        .loader-logo-item img {
            width: 48px; height: 48px;
            object-fit: contain;
        }
